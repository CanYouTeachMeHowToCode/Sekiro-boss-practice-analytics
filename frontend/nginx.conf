server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Recording uploads (V4 M3): up to the backend's 2 GB limit, passed through as they arrive instead of being
    # buffered to disk here first, with time to send a large file.
    location /api/recordings {
        proxy_pass http://backend:8000/api/recordings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
