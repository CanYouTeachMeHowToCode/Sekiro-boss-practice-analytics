services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sekiro}
      POSTGRES_USER: ${POSTGRES_USER:-sekiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sekiro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sekiro}
      # uploaded recordings and their clips (V4 M3); never in the database
      RECORDINGS_DIR: /data/recordings
    volumes:
      - recordings-data:/data/recordings
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Checks uploaded recordings and turns them into failure reports (V4 M3).
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sekiro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sekiro}
      RECORDINGS_DIR: /data/recordings
      # cpu, or cuda with a CUDA build of the image and a GPU passed to the container
      ANALYSIS_DEVICE: ${ANALYSIS_DEVICE:-cpu}
    volumes:
      - recordings-data:/data/recordings
      # the pipeline's local data folder (export_analysis_data.py); without it uploads are checked but not analysed
      - ${ANALYSIS_DATA:-./analysis-data}:/data/analysis:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  recordings-data:
